name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: earnings
          POSTGRES_PASSWORD: earnings
          POSTGRES_DB: earnings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U earnings -d earnings"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Available for postgres package tests; do not set STORAGE_MODE globally
      # (orchestrator unit tests stay Memory-only unless opted in).
      DATABASE_URL: postgres://earnings:earnings@127.0.0.1:5432/earnings?sslmode=disable
      MIGRATIONS_DIR: migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: make test
