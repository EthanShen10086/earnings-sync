<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>earnings-sync · 财报只读</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --ink: #e8eef5;
      --muted: #8b9aab;
      --line: #2c3a49;
      --accent: #3d9cf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Source Han Sans SC", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1b3a55 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #243028 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    main { max-width: 960px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    h1 { font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.35rem; font-size: 1.75rem; }
    .sub { color: var(--muted); margin: 0 0 1.5rem; line-height: 1.5; }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    input, button {
      font: inherit; border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel); color: var(--ink); padding: 0.55rem 0.85rem;
    }
    button { background: var(--accent); border-color: transparent; color: #041018; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.05); }
    table { width: 100%; border-collapse: collapse; background: color-mix(in srgb, var(--panel) 88%, transparent); }
    th, td { text-align: left; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
    th { color: var(--muted); font-weight: 500; }
    .err { color: #ff8e8e; margin-top: 0.75rem; }
    .ok { color: var(--muted); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <h1>earnings-sync</h1>
    <p class="sub">最小只读页：从 API / PostgreSQL 拉一张公司的财报事实表。不是设计系统，只为验收双写读回。</p>
    <div class="row">
      <input id="ticker" value="AAPL" aria-label="ticker" />
      <input id="api" value="http://127.0.0.1:8090" aria-label="api base" style="min-width:16rem" />
      <button type="button" id="load">加载</button>
    </div>
    <div id="status" class="ok">尚未加载</div>
    <table>
      <thead>
        <tr><th>期间</th><th>科目</th><th>数值</th><th>单位</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    const status = document.getElementById("status");
    const rows = document.getElementById("rows");
    async function load() {
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      const base = document.getElementById("api").value.replace(/\/$/, "");
      status.className = "ok";
      status.textContent = "加载中…";
      rows.innerHTML = "";
      try {
        const res = await fetch(base + "/v1/facts?ticker=" + encodeURIComponent(ticker));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        const facts = data.facts || [];
        if (!facts.length) {
          status.textContent = "无数据。先用 STORAGE_MODE=dual|pg-only ingest 一份 fixture。";
          return;
        }
        status.textContent = "共 " + facts.length + " 条";
        for (const f of facts) {
          const tr = document.createElement("tr");
          const period = f.fiscal_year + "Q" + f.fiscal_quarter;
          const val = f.value != null ? f.value : (f.text || "");
          tr.innerHTML = "<td>" + period + "</td><td>" + f.line_item + "</td><td>" + val + "</td><td>" + (f.unit || "") + "</td>";
          rows.appendChild(tr);
        }
      } catch (e) {
        status.className = "err";
        status.textContent = String(e.message || e);
      }
    }
    document.getElementById("load").addEventListener("click", load);
  </script>
</body>
</html>
