<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>earnings-sync</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <div class="topbar">
      <div>
        <h1 id="title">earnings-sync</h1>
        <p class="sub" id="subtitle">只读事实表骨架：排序 / 筛选 / 导出占位；鉴权默认 bypass，无密钥可演示。</p>
      </div>
      <div class="toolbar">
        <div class="toggles" role="group" aria-label="theme">
          <button type="button" class="chip" id="theme-dark" aria-pressed="true">深色</button>
          <button type="button" class="chip" id="theme-light" aria-pressed="false">浅色</button>
        </div>
        <div class="toggles" role="group" aria-label="language">
          <button type="button" class="chip" id="lang-zh" aria-pressed="true">中文</button>
          <button type="button" class="chip" id="lang-en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <label><span id="lbl-ticker">Ticker</span><input id="ticker" value="AAPL" autocomplete="off" /></label>
      <label><span id="lbl-api">API Base</span><input id="api" value="http://127.0.0.1:8090" autocomplete="off" /></label>
      <label><span id="lbl-filter">筛选科目</span><input id="filter" value="" placeholder="revenue" autocomplete="off" /></label>
      <label><span id="lbl-token">Bearer（可选）</span><input id="token" value="" placeholder="AUTH_BEARER_TOKEN" autocomplete="off" /></label>
    </div>

    <div class="actions">
      <button type="button" id="load">加载</button>
      <button type="button" class="secondary" id="exportCsv">导出 CSV</button>
      <button type="button" class="secondary" id="refreshAuth">刷新身份</button>
    </div>

    <p class="whoami" id="whoami"></p>
    <div class="status" id="status"></div>

    <div class="table-shell">
      <table>
        <thead>
          <tr>
            <th id="th-period" scope="col">期间</th>
            <th id="th-item" scope="col">科目</th>
            <th id="th-value" scope="col">数值</th>
            <th id="th-unit" scope="col">单位</th>
            <th id="th-actions" scope="col">操作</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty"></div>
    </div>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
