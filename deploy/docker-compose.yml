services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: earnings
      POSTGRES_PASSWORD: earnings
      POSTGRES_DB: earnings
    ports:
      - "5432:5432"
    volumes:
      - earnings_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earnings -d earnings"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional cache / Redis Streams MQ. App degrades to in-memory when down.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["cache", "mq"]

  # Optional lightweight MQ alternative to Redis Streams.
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    profiles: ["mq"]

  # Local object-store stand-in (S3 API). App still defaults to filesystem stub.
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: earnings
      MINIO_ROOT_PASSWORD: earningsdev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - earnings_minio:/data
    profiles: ["objects"]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4318:4318"
    profiles: ["observe"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    profiles: ["observe"]

  # Optional dashboard host — datasources + dashboards auto-provisioned.
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    profiles: ["observe"]

  # ELK skeleton: Elasticsearch + Kibana + Filebeat.
  # App can also ship via internal/observability to file or ELASTICSEARCH_URL.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - earnings_es:/usr/share/elasticsearch/data
    profiles: ["elk"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles: ["elk"]

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    user: root
    volumes:
      - ./elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../data/logs:/var/log/earnings-sync:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles: ["elk"]
    command: ["filebeat", "-e", "-strict.perms=false"]

volumes:
  earnings_pg:
  earnings_minio:
  earnings_es:
