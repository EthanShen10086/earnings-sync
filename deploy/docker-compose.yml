services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: earnings
      POSTGRES_PASSWORD: earnings
      POSTGRES_DB: earnings
    ports:
      - "5432:5432"
    volumes:
      - earnings_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earnings -d earnings"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional cache / Redis Streams MQ. App degrades to in-memory when down.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["cache", "mq"]

  # Optional lightweight MQ alternative to Redis Streams.
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    profiles: ["mq"]

  # Local object-store stand-in (S3 API). App still defaults to filesystem stub.
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: earnings
      MINIO_ROOT_PASSWORD: earningsdev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - earnings_minio:/data
    profiles: ["objects"]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4318:4318"
    profiles: ["observe"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observe"]

  # Optional dashboard host — import deploy/grafana/dashboards/earnings-sync.json manually.
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles: ["observe"]

volumes:
  earnings_pg:
  earnings_minio:
