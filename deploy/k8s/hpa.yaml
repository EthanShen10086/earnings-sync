# HPA — apply after metrics-server exists. Local validate uses dry-run only.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: earnings-sync
  namespace: earnings-sync
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: earnings-sync
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
