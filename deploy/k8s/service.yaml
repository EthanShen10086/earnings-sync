apiVersion: v1
kind: Service
metadata:
  name: earnings-sync
  labels:
    app: earnings-sync
spec:
  type: ClusterIP
  selector:
    app: earnings-sync
    # Blue/green cutover: change slot blue → green after the green Deployment is ready.
    slot: blue
  ports:
    - name: http
      port: 80
      targetPort: http
