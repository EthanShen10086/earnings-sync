apiVersion: v1
kind: Service
metadata:
  name: earnings-sync
  namespace: earnings-sync
  labels:
    app: earnings-sync
spec:
  type: ClusterIP
  selector:
    app: earnings-sync
    # Flip slot: blue → green (or canary) after soak / promote.
    slot: blue
  ports:
    - name: http
      port: 80
      targetPort: http
