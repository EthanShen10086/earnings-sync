  - ticker: BRK
    name: Berkshire Hathaway
    fiscal_year_end_month: 12
    spreadsheet_id: 1RbIXpks5dvj9IntzmOC3TKJQnlYHwm3lz1AcKRZNgTA
    segment_total: disclosed_operating_earnings
    prompt: |
      财年是自然年。金额用十亿美元。比率用小数，91.4% 写成 0.914。股数用股，不要换成十亿股。每股收益用美元。
      六个经营利润分部是税后、归属于伯克希尔股东的金额，不是税前，也不是营收。只用「三个月 / Third Quarter」那一列，不要把前九个月累计写进当季。
      insurance_investment_income 是保险浮存金的利息和股息。other_operating 含汇兑、公司利息和权益法，不是铁路、能源或制造。
      disclosed_operating_earnings 是公告里的经营利润合计。disclosed_net_income 和 net_income 都写公告里的归母净利润。investment_gains 是税后投资损益，含未实现。没有卡夫亨氏减值就省略 kraft_impairment，不要填 0。
      现金流量表如果只有年初至今，写入 ytd_ 开头的字段，不要把九个月的数写入 operating_cash_flow 或 capex。
      cash 是保险及其他现金，不是铁路能源现金。short_term_investments 是短期美国国债。long_term_debt 是铁路和能源借款。equity 是披露的归母权益。float 是保险浮存金。
