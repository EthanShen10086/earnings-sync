# 最小可跑的财报导入编排示例（离线 stub 工具，不碰 Google Sheet / 飞书 / DeepSeek）。
# 设计对齐 fit-ai-plugin Flow Runtime：YAML DAG + needs + condition/when 分支 + agent/tool 节点。
title: earnings-ingest-demo
agent: earnings
model: deepseek-flash
concurrency: 2
inputs:
  ticker:
    type: text
    title: 股票代码
    required: true
  dry_run:
    type: json
    title: 是否只演练
    required: true
output:
  from: nodes
  nodeIds: [extract, write, notify, summarize]
  as: record
nodes:
  - id: validate
    type: tool
    title: 校验输入
    tool: validate_ingest
    input:
      ticker: { from: input, key: ticker }
      dry_run: { from: input, key: dry_run }
    retry:
      maxAttempts: 2
      backoffMs: 50

  - id: extract
    type: tool
    title: 抽取财季事实（stub）
    tool: extract_facts_stub
    needs: [validate]
    input:
      ticker: { from: node, nodeId: validate, path: ticker }

  - id: reconcile
    type: tool
    title: 勾稽检查（stub）
    tool: reconcile_stub
    needs: [extract]
    input:
      from: node
      nodeId: extract

  - id: decide
    type: condition
    title: dry_run 分支
    needs: [validate]
    equals: true
    branchTrue: dry
    branchFalse: live
    input:
      value: { from: node, nodeId: validate, path: dry_run }

  - id: write
    type: tool
    title: 写入表格（仅 live）
    tool: upsert_period_stub
    needs: [reconcile, decide]
    when:
      from: node
      nodeId: decide
      path: branch
      equals: live
    onFailure: stop
    input:
      ticker: { from: node, nodeId: extract, path: ticker }
      period: { from: node, nodeId: extract, path: period }
      facts: { from: node, nodeId: extract, path: facts }

  - id: notify
    type: tool
    title: 飞书通知（仅 live）
    tool: notify_stub
    # 不依赖 write：dry_run 时 write 会被跳过，若 needs 它会把 notify 一并跳过。
    needs: [extract, decide]
    when:
      from: node
      nodeId: decide
      path: branch
      equals: live
    onFailure: continue
    input:
      ticker: { from: node, nodeId: extract, path: ticker }
      period: { from: node, nodeId: extract, path: period }
      takeaway: { from: node, nodeId: extract, path: takeaway }

  - id: summarize
    type: agent
    title: 总结本轮动作
    needs: [extract]
    prompt: |
      根据抽取结果写一句中文结论，说明 ticker、财季和是否 dry_run。
      不要编造未提供的数字。
    input:
      extraction: { from: node, nodeId: extract }
      dry_run: { from: input, key: dry_run }
    retry:
      maxAttempts: 2
      backoffMs: 100
