# 财报导入编排：校验输入后调用真实 pipeline.Ingest（拉/解析/勾稽/写表/通知）。
# dry_run=true 时 pipeline 只抽取不写表；dry_run=false 时写入 Sheets（本地默认 Memory）。
title: earnings-ingest
agent: earnings
model: deepseek-flash
concurrency: 2
inputs:
  ticker:
    type: text
    title: 股票代码
    required: true
  dry_run:
    type: json
    title: 是否只演练
    required: true
  body_path:
    type: text
    title: 本地财报 fixture 路径
    required: false
  url:
    type: text
    title: 远端财报 URL
    required: false
  force:
    type: json
    title: 强制重跑（忽略已成功 job）
    required: false
output:
  from: nodes
  nodeIds: [ingest, summarize]
  as: record
nodes:
  - id: validate
    type: tool
    title: 校验输入
    tool: validate_ingest
    input:
      ticker: { from: input, key: ticker }
      dry_run: { from: input, key: dry_run }
    retry:
      maxAttempts: 2
      backoffMs: 50

  - id: ingest
    type: tool
    title: pipeline.Ingest（真实拉/解析/写入）
    tool: pipeline_ingest
    needs: [validate]
    onFailure: stop
    timeoutMs: 90000
    input:
      ticker: { from: node, nodeId: validate, path: ticker }
      dry_run: { from: node, nodeId: validate, path: dry_run }
      body_path: { from: input, key: body_path }
      url: { from: input, key: url }
      force: { from: input, key: force }
    retry:
      maxAttempts: 2
      backoffMs: 100

  - id: summarize
    type: agent
    title: 总结本轮动作
    needs: [ingest]
    timeoutMs: 30000
    prompt: |
      根据 ingest 结果写一句中文结论，说明 ticker、财季、cells 写入数、是否 dry_run。
      不要编造未提供的数字。
    input:
      ingest: { from: node, nodeId: ingest }
      dry_run: { from: input, key: dry_run }
    retry:
      maxAttempts: 2
      backoffMs: 100
    onFailure: continue
