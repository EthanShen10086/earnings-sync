global:
  namespace: Development
  env_name: local

server:
  app: earnings
  server: sync
  filter:
    - opentelemetry
  admin:
    ip: 127.0.0.1
    port: 8091
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.earnings.sync.HTTP
      ip: 0.0.0.0
      port: 8090
      network: tcp
      protocol: http_no_protocol
      timeout: 120000

client:
  timeout: 60000
  filter:
    - opentelemetry
